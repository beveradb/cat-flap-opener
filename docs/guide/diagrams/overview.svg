<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#bbb" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="960" height="720" fill="#ffffff"/>

  <!-- side labels -->
  <rect x="0" y="0" width="455" height="36" fill="#fff4e6"/>
  <rect x="505" y="0" width="455" height="36" fill="#eaf6ea"/>
  <text x="227" y="24" text-anchor="middle" font-weight="bold" font-size="16" fill="#8a5a1a">INSIDE — living room</text>
  <text x="732" y="24" text-anchor="middle" font-weight="bold" font-size="16" fill="#2f6b2f">OUTSIDE — catio</text>
  <text x="940" y="712" text-anchor="end" font-size="12" fill="#777">side cross-section (not to scale)</text>

  <!-- wall above window -->
  <rect x="455" y="36" width="50" height="44" fill="url(#hatch)" stroke="#999"/>
  <!-- wooden window frame (head) -->
  <rect x="440" y="80" width="80" height="70" fill="#c8a26b" stroke="#8a6a3a" stroke-width="2"/>
  <text x="480" y="120" text-anchor="middle" font-size="11" fill="#5a3f15">wood</text>
  <text x="480" y="133" text-anchor="middle" font-size="11" fill="#5a3f15">frame</text>

  <!-- acrylic panel -->
  <rect x="474" y="150" width="12" height="440" fill="#cfe8f5" stroke="#7fb3d1"/>
  <!-- sill + wall below -->
  <rect x="440" y="590" width="80" height="18" fill="#c8a26b" stroke="#8a6a3a" stroke-width="2"/>
  <rect x="455" y="608" width="50" height="112" fill="url(#hatch)" stroke="#999"/>

  <!-- cat flap tunnel -->
  <rect x="448" y="270" width="64" height="170" fill="#f3f3f3" stroke="#888" stroke-width="2"/>
  <!-- hinge -->
  <circle cx="480" cy="282" r="4" fill="#555"/>
  <!-- closed flap -->
  <line x1="480" y1="282" x2="480" y2="428" stroke="#5a9cc4" stroke-width="6" stroke-linecap="round"/>
  <!-- open flap ghost (swung inward ~65deg) -->
  <line x1="480" y1="282" x2="348" y2="344" stroke="#5a9cc4" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 6" opacity="0.7"/>
  <path d="M480,400 A118,118 0 0 1 380,338" fill="none" stroke="#5a9cc4" stroke-width="1.5" marker-end="url(#arr)" opacity="0.8"/>

  <!-- controller box on frame (inside face) -->
  <rect x="330" y="88" width="62" height="34" rx="4" fill="#2d2d2d"/>
  <text x="361" y="109" text-anchor="middle" font-size="10" fill="#fff">controller</text>
  <!-- motor + pulley -->
  <rect x="402" y="96" width="36" height="36" rx="18" fill="#3b6fb6" stroke="#244c85" stroke-width="2"/>
  <circle cx="420" cy="140" r="11" fill="#bfc5cc" stroke="#6b7580" stroke-width="2"/>
  <circle cx="420" cy="140" r="3" fill="#6b7580"/>
  <!-- cord: slack when closed -->
  <path d="M411,146 C 405,250 440,330 470,424" fill="none" stroke="#111" stroke-width="2"/>
  <!-- cord when open -->
  <line x1="411" y1="146" x2="350" y2="340" stroke="#111" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.6"/>
  <circle cx="474" cy="424" r="3" fill="#111"/>

  <!-- inside ToF sensor + beam -->
  <rect x="444" y="152" width="18" height="10" fill="#7a3fb0"/>
  <polygon points="448,162 458,162 420,470 300,470" fill="#7a3fb0" opacity="0.12"/>

  <!-- inside shelf -->
  <rect x="150" y="470" width="298" height="16" fill="#c8a26b" stroke="#8a6a3a" stroke-width="2"/>
  <rect x="160" y="486" width="10" height="40" fill="#c8a26b" stroke="#8a6a3a"/>

  <!-- OMalley on inside shelf -->
  <g transform="translate(250,392)">
    <ellipse cx="45" cy="52" rx="58" ry="28" fill="#f28c28"/>
    <circle cx="110" cy="22" r="24" fill="#f28c28"/>
    <polygon points="94,6 100,-16 110,2" fill="#f28c28"/>
    <polygon points="114,2 124,-16 128,8" fill="#f28c28"/>
    <circle cx="118" cy="18" r="3" fill="#333"/>
    <path d="M-12,48 C -40,40 -40,10 -22,4" fill="none" stroke="#f28c28" stroke-width="9" stroke-linecap="round"/>
    <rect x="0" y="66" width="12" height="16" fill="#f28c28"/>
    <rect x="80" y="66" width="12" height="16" fill="#f28c28"/>
    <text x="45" y="58" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">OMalley</text>
  </g>

  <!-- outside sensor box + beam -->
  <rect x="522" y="152" width="40" height="28" rx="3" fill="#e9e9e9" stroke="#777" stroke-width="2"/>
  <rect x="534" y="177" width="16" height="4" fill="#7a3fb0"/>
  <polygon points="536,181 548,181 690,480 560,480" fill="#7a3fb0" opacity="0.12"/>
  <!-- outside shelf -->
  <rect x="512" y="480" width="290" height="16" fill="#c8a26b" stroke="#8a6a3a" stroke-width="2"/>
  <rect x="780" y="496" width="10" height="40" fill="#c8a26b" stroke="#8a6a3a"/>
  <!-- catio mesh hint -->
  <line x1="860" y1="70" x2="860" y2="700" stroke="#8fb88f" stroke-width="2" stroke-dasharray="3 5"/>
  <text x="870" y="360" font-size="12" fill="#2f6b2f" transform="rotate(90 870 360)">catio mesh</text>
  <!-- rain -->
  <g stroke="#7fb3d1" stroke-width="2">
    <line x1="620" y1="70" x2="614" y2="86"/><line x1="660" y1="96" x2="654" y2="112"/>
    <line x1="700" y1="60" x2="694" y2="76"/><line x1="740" y1="100" x2="734" y2="116"/>
  </g>

  <!-- outside cable through acrylic -->
  <path d="M522,168 C 500,168 492,190 480,196 C 470,202 420,196 392,118" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="7 4"/>
  <!-- USB cable -->
  <path d="M330,112 L 110,112 Q 95,112 95,127 L 95,640" fill="none" stroke="#999" stroke-width="3"/>
  <rect x="60" y="640" width="70" height="46" rx="6" fill="#fafafa" stroke="#777" stroke-width="2"/>
  <rect x="80" y="652" width="30" height="20" rx="3" fill="#ddd" stroke="#777"/>

  <!-- ===== Labels ===== -->
  <g font-size="13" fill="#222">
    <!-- controller -->
    <line x1="340" y1="88" x2="250" y2="70" stroke="#444"/>
    <text x="110" y="66">① Controller box (QT Py ESP32-S3</text>
    <text x="110" y="82">    + ULN2003 driver + button)</text>
    <!-- motor -->
    <text x="30" y="166">② 28BYJ-48 stepper + GT2 pulley</text>
    <text x="30" y="182">    (screwed to wood frame)</text>
    <line x1="240" y1="170" x2="404" y2="122" stroke="#444"/>
    <!-- ToF in -->
    <line x1="446" y1="160" x2="400" y2="230" stroke="#444"/>
    <text x="250" y="246">③ Inside ToF sensor — BESIDE</text>
    <text x="250" y="262">    the flap, aimed at the shelf</text>
    <!-- cord -->
    <line x1="444" y1="300" x2="562" y2="566" stroke="#444"/>
    <!-- flap -->
    <line x1="512" y1="360" x2="600" y2="400" stroke="#444"/>
    <text x="605" y="398">④ Cat flap (SureFlap, latch disabled)</text>
    <text x="605" y="414">    lifted INTO the room → he walks</text>
    <text x="605" y="430">    under it in either direction</text>
    <!-- outside -->
    <line x1="562" y1="160" x2="610" y2="130" stroke="#444"/>
    <text x="614" y="126">⑤ Outside ToF sensor in IP65 box,</text>
    <text x="614" y="142">    window facing DOWN (rain-sheltered)</text>
    <!-- cable -->
    <line x1="490" y1="196" x2="600" y2="220" stroke="#444"/>
    <text x="604" y="224">⑥ 4-core cable through a small</text>
    <text x="604" y="240">    sealed hole in the acrylic</text>
    <text x="566" y="572">⑦ Braided cord: slack when closed,</text>
    <text x="566" y="588">    wound in to open (dashed = open)</text>
    <!-- usb -->
    <text x="150" y="628">⑧ One USB-C cable along the frame &amp; down the wall</text>
    <text x="150" y="644">    to an existing USB plug</text>
  </g>
</svg>
